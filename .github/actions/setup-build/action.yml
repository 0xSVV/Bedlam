name: Set up build toolchain
description: Java, Go, gomobile, Android NDK, and Gradle for building Bedlam, at the Go and NDK versions in .github/toolchain.env and the gomobile version that hysteria/golib/go.mod selects.
inputs:
  cache:
    description: Restore and save the Go and Gradle caches.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Read toolchain pins
      id: pins
      shell: bash
      run: |
        go_version=$(sed -n 's/^GO_VERSION=//p' .github/toolchain.env)
        ndk_version=$(sed -n 's/^NDK_VERSION=//p' .github/toolchain.env)
        if [ -z "$go_version" ] || [ -z "$ndk_version" ]; then
          echo "::error::GO_VERSION and NDK_VERSION must be set in .github/toolchain.env"
          exit 1
        fi
        echo "go=$go_version" >> "$GITHUB_OUTPUT"
        echo "ndk=$ndk_version" >> "$GITHUB_OUTPUT"
        echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "21"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.pins.outputs.go }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: hysteria/golib/go.sum
    - name: Install gomobile and gobind at the go.mod version
      shell: bash
      working-directory: hysteria/golib
      run: |
        mobile_version=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
        go install "golang.org/x/mobile/cmd/gomobile@$mobile_version" "golang.org/x/mobile/cmd/gobind@$mobile_version"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Point Gradle at the pinned NDK
      shell: bash
      env:
        NDK_VERSION: ${{ steps.pins.outputs.ndk }}
      run: |
        ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
        if [ ! -f "$ndk/source.properties" ]; then
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
        fi
        echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: ${{ inputs.cache != 'true' }}
